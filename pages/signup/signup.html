<form class="stack" novalidate>
  <div><h2>나만의 장소 찾기 시작</h2><p class="sub">이메일과 비밀번호로 계정을 만드세요.</p></div>
  <div>
    <label class="lab" for="email">이메일</label>
    <div class="field"><input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email"></div>
    <div class="err" data-err="email"></div>
  </div>
  <div>
    <label class="lab" for="pw">비밀번호</label>
    <div class="field"><input id="pw" name="pw" type="password" placeholder="비밀번호 입력" autocomplete="new-password"></div>
    <div class="sub small">8자 이상, 영문과 숫자를 함께 입력해 주세요.</div>
    <div class="err" data-err="pw"></div>
  </div>
  <div>
    <label class="lab" for="pw2">비밀번호 확인</label>
    <div class="field"><input id="pw2" name="pw2" type="password" placeholder="비밀번호 다시 입력" autocomplete="new-password"></div>
    <div class="err" data-err="pw2"></div>
  </div>
  <label><input type="checkbox" name="terms"> [필수] 서비스 이용약관 동의 <button type="button" class="link" data-act="terms">보기</button></label>
  <label><input type="checkbox" name="priv"> [필수] 개인정보 수집·이용 동의 <button type="button" class="link" data-act="terms">보기</button></label>
  <div class="err" data-err="fail"></div>
  <button class="btn primary" type="submit" disabled>동의하고 계정 만들기</button>
  <p class="note">가입 완료 시 계정을 생성하고 사용자 데이터를 저장합니다. 로그인 후 취향과 장소 기록이 이 계정에 연결됩니다.</p>
  <button type="button" class="link" data-nav="#/login">이미 계정이 있다면 로그인으로 이동 →</button>
</form>

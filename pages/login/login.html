<form class="stack" novalidate>
  <div><h2>다시 만나 반가워요</h2><p class="sub">로그인하고 저장한 취향과 장소를 이어서 확인하세요.</p></div>
  <div>
    <label class="lab" for="email">이메일</label>
    <div class="field"><input id="email" name="email" type="email" placeholder="이메일 주소 입력" autocomplete="username"></div>
    <div class="err" data-err="email"></div>
  </div>
  <div>
    <label class="lab" for="pw">비밀번호</label>
    <div class="field"><input id="pw" name="pw" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
      <button type="button" data-act="toggle" aria-label="비밀번호 표시 전환">표시</button></div>
    <div class="err" data-err="pw"></div>
  </div>
  <button class="btn primary" type="submit">로그인</button>
  <p class="note">인증이 완료되면 계정에 연결된 취향, 즐겨찾기와 최근 조회 기록을 불러옵니다.</p>
  <hr>
  <p class="sub">아직 계정이 없으신가요?</p>
  <button class="btn" type="button" data-nav="#/signup">회원가입으로 이동</button>
</form>

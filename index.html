<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlaceON 로우파이 와이어프레임 (모바일)</title>
<style>
/* 로우파이: 흑백 · 단일 서체/크기/굵기 · 아이콘 없음 · 둥근 모서리/그림자 없음 */
*{box-sizing:border-box;margin:0;padding:0;font:inherit;color:#000;border-radius:0}
html{font:16px/1.5 sans-serif;-webkit-text-size-adjust:100%}
html,body{height:100%;overscroll-behavior:none}
body{background:#fff;display:flex;justify-content:center;align-items:center;padding:24px 8px}
button,input{background:#fff;border:1px solid #000;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{cursor:text;padding:12px;width:100%;outline:none}
input:focus{outline:2px solid #000;outline-offset:1px}
hr{border:0;border-top:1px solid #000}

.phone{width:100%;max-width:430px;height:min(calc(100vh - 48px),860px);height:min(calc(100dvh - 48px),860px);border:2px solid #000;display:flex;flex-direction:column;position:relative}
#bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid #000;min-height:56px}
#bar button{min-height:44px;padding:4px 14px}
#bar .t{flex:1}
#content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
#content.full{padding:0;overflow:hidden;position:relative}
#content>*+*,.stk>*+*{margin-top:12px}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #000}
#tabs button{border:0;border-left:1px solid #000;min-height:56px}
#tabs button:first-child{border-left:0}
#tabs button.on,.c.on,.sg button.on{background:#000;color:#fff}

.b{display:block;width:100%;min-height:44px;padding:11px;text-align:center}
.b.p{border:3px double #000}
.b.sm,.s{width:auto;display:inline-block;min-height:44px;padding:8px 14px}
button:disabled{border-style:dashed;cursor:not-allowed}
.c{min-height:44px;padding:8px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bt>button{flex:none;white-space:nowrap}
.bt>span{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.card .bt{align-items:flex-start}
.box{border:1px solid #000;padding:12px}
.dash{border:1px dashed #000;padding:12px}
.card{display:flex;gap:12px;border:1px solid #000;padding:12px;cursor:pointer;position:relative;background:#fff}
.card .img{width:80px;height:80px;flex:none}
.card .bd{flex:1;min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.img{border:1px solid #000;display:grid;place-items:center;
  background:linear-gradient(to top right,transparent calc(50% - .5px),#000 calc(50% - .5px),#000 calc(50% + .5px),transparent calc(50% + .5px)),
             linear-gradient(to top left,transparent calc(50% - .5px),#000 calc(50% - .5px),#000 calc(50% + .5px),transparent calc(50% + .5px))}
.img span{background:#fff;padding:0 6px;text-align:center}
.img.h{height:150px}.img.m{height:130px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #000}
.sg button{border:0;border-left:1px solid #000;min-height:44px}
.sg button:first-child{border-left:0}
.user{display:flex;gap:12px;align-items:center}
.user .img{width:44px;height:44px;flex:none}
.user .g{flex:1}
.pw{display:flex;gap:8px}
.ck{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid #000;flex:none;line-height:1}
.ck.sm{width:18px;height:18px;font-size:12px}
.ckb{border:0;display:flex;align-items:center;gap:10px;text-align:left;min-height:44px;padding:0}
.bt>.ckb{flex:1;white-space:normal}
.rule{display:flex;gap:8px;align-items:center}
[data-rules]>*+*{margin-top:4px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:12px 20px}
.kv>span{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.pw .field{flex:1}
.msg{position:absolute;left:16px;right:16px;bottom:72px;border:2px solid #000;background:#fff;padding:8px 12px;z-index:9}

/* 홈: 전체 화면 지도 + 바텀시트 */
.home{position:absolute;inset:0;overflow:hidden;--sh:120px}
.homemap{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;background:#fff;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{display:block;pointer-events:none}
.pin{position:absolute;z-index:3;transform:translate(-50%,-100%) scale(calc(1 / var(--k,1)));transform-origin:50% 100%;border:0;background:none;padding:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pin i{display:block;width:14px;height:14px;background:#000}
.pin small,.me small{font-size:12px;border:1px solid #000;background:#fff;padding:0 6px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.me{position:absolute;z-index:2;width:18px;height:18px;border-radius:50%;background:#000;border:3px solid #fff;box-shadow:0 0 0 2px #000;transform:translate(-50%,-50%) scale(calc(1 / var(--k,1)))}
.me small{position:absolute;top:28px;left:50%;transform:translateX(-50%)}
.maptop{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.maptop>*{pointer-events:auto;align-self:flex-start}
.pill{border:1px solid #000;background:#fff;padding:4px 12px}
.maptop .dash{background:#fff;padding:2px 8px;font-size:12px}
.ctrl{position:absolute;right:10px;bottom:calc(var(--sh) + 12px);z-index:5;display:flex;flex-direction:column;gap:6px}
.ctrl{align-items:flex-end}
.ctrl button{min-width:44px;min-height:44px;padding:0 10px}
.home.max .ctrl{display:none}
.pop{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:24px}
.pop[hidden]{display:none}
.popbg{position:absolute;inset:0}
.popbox{position:relative;width:100%;max-height:80%;overflow:auto;background:#fff;border:2px solid #000;padding:16px}
.popbox>*+*{margin-top:12px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;height:120px;background:#fff;border-top:2px solid #000;display:flex;flex-direction:column}
.drag{touch-action:none;cursor:grab;flex:none}
.grab{padding:10px 0;display:grid;place-items:center}
.grab i{display:block;width:40px;height:4px;background:#000}
.sheet-head{padding:0 16px 10px}
.sheet-list{flex:1;overflow-y:auto;padding:4px 16px 16px}
.sheet-list>*+*{margin-top:12px}
</style>
</head>
<body>

<div class="phone" id="phone">
  <header id="bar"></header>
  <main id="content"></main>
  <nav id="tabs" hidden></nav>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const nickHint = v => {                      // 충족하지 못한 조건만 한 줄로
  const n = [...v].length, bad = [...v].filter(c => !/[가-힣A-Za-z0-9]/.test(c)).length, miss = [];
  if (n < 2 || n > 12) miss.push('2~12자');
  if (n === 0 || bad > 0) miss.push('한글·영문·숫자만');
  return miss.length ? { ok: false, text: miss.join(', ') } : { ok: true, text: '사용 가능한 닉네임이에요' };
};
const pwHint = v => {
  const miss = [], inc = [];
  if (v.length < 8) miss.push('8자 이상'); else if (v.length > 20) miss.push('20자 이하');
  if (!/[A-Z]/.test(v)) inc.push('대문자');
  if (!/[0-9]/.test(v)) inc.push('숫자');
  if (!/[^A-Za-z0-9\s]/.test(v)) inc.push('특수문자');
  if (inc.length) miss.push(inc.join('·') + ' 포함');
  if (/\s/.test(v)) miss.push('공백 제외');
  return miss.length ? { ok: false, text: miss.join(', ') } : { ok: true, text: '사용 가능한 비밀번호예요' };
};
const hintText = h => (h.ok ? '✓ ' : '') + h.text;
const signupOk = g => nickHint(g.nick).ok && pwHint(g.pw).ok && !!g.pw && g.pw === g.pw2 && g.terms && g.priv;
const toggle = (a, v) => a.includes(v) ? a.filter(x => x !== v) : [...a, v];
const countBy = (arr, f) => { const m = new Map(); arr.forEach(x => m.set(f(x), (m.get(f(x)) || 0) + 1)); return m; };
const byCount = m => [...m.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);

/* ───────── 장소 데이터: stores.json → 화면용 필드로 정규화 ───────── */
const FLOOR = { '지상': ['지상'], '지상2층이상': ['지상 2층 이상'], '지하': ['지하'], '지상+지하': ['지상', '지하'], '지하 및 지상': ['지상', '지하'] };
const STORES = JSON.parse(document.getElementById('stores').textContent).map(r => ({
  id: r.id, name: r['업소명'],
  address: (r['소재지 도로'] || '').trim(),
  jibun: (r['소재지 지번'] || '').replace(/\s{2,}/g, ' ').trim(),
  area: r['행정동명'] || '',
  category: r['카테고리'] || '미분류',
  type: r['업태명'] || '',
  floors: FLOOR[r['업소위치']] || []
}));
const BY = Object.fromEntries(STORES.map(s => [s.id, s]));
const place = id => BY[id];
const CATS = byCount(countBy(STORES.filter(s => s.category !== '미분류'), s => s.category));      // 카테고리: 많은 순
const TYPES = Object.fromEntries(CATS.map(c => [c, byCount(countBy(STORES.filter(s => s.category === c && s.type), s => s.type))]));  // 카테고리별 업태
const TOP_AREAS = byCount(countBy(STORES.filter(s => s.area), s => s.area)).slice(0, 3);          // 지역 칩: 상위 3 + 그 외
const FLOORS = ['지상', '지상 2층 이상', '지하'];
const floorText = p => p.floors.join(' · ') || '층 정보 없음';
const fcount = f => (f.area ? 1 : 0) + (f.category ? 1 : 0) + f.types.length + f.floors.length;
const noFilter = () => ({ area: '', category: '', types: [], floors: [] });
const pageOf = n => n * D.pageSize;
let S;

function init() {
  const d = D.defaults, now = Date.now();
  const pick = (cat, type) => STORES.find(s => s.area === d.area && s.category === cat && (!type || s.type === type)) || STORES.find(s => s.category === cat);
  const a = pick('카페/디저트', '카페/음료'), b = pick('음식점', '한식'), c = pick('카페/디저트', '베이커리'), e = pick('음식점', '양식'), f = pick('문화/여가');
  S = {
    screen: '01', user: false, err: '', loginNick: '', popCat: '',
    area: d.area, search: { ...d.search }, applied: noFilter(), draft: null, nearCat: '',
    prefs: structuredClone(d.prefs), pdraft: structuredClone(d.prefs), favCat: '',
    saved: new Set([a.id, b.id, c.id]),
    history: [{ id: a.id, at: now }, { id: e.id, at: now - 2 * 3600e3 }, { id: f.id, at: now - 24 * 3600e3 }],
    shown: { home: 1, search: 1 },
    placeId: null, from: '04',
    login: { pw: '', show: false, busy: false, err: {} },
    signup: { nick: '', pw: '', pw2: '', terms: false, priv: false, state: 'idle' }
  };
}

/* ───────── 추천·검색 로직 ───────── */
const scoreOf = p => (S.prefs.cats.includes(p.category) ? 2 : 0) + (S.prefs.types.includes(p.type) ? 1 : 0);
function recommend() {                     // 홈: 현재 위치(행정동) 기준. 필터 팝업에서 카테고리를 고르면 그 카테고리 전체, 아니면 취향 기반
  const { cats, types } = S.prefs, any = cats.length || types.length;
  return STORES.filter(p => (!S.area || p.area === S.area) && (S.nearCat ? p.category === S.nearCat : (!any || scoreOf(p) > 0)))
    .sort((a, b) => scoreOf(b) - scoreOf(a) || a.id - b.id);
}
function searchStores() {                  // 검색: 키워드(업소명·카테고리·업태) / 지명·장소명(행정동·주소·업소명) + 적용 필터
  const q = S.search.query.trim(), f = S.applied;
  if (!q) return [];
  return STORES.filter(p => {
    const hit = S.search.mode === 'keyword' ? [p.name, p.category, p.type].some(x => x.includes(q)) : [p.area, p.address, p.jibun, p.name].some(x => x.includes(q));
    const ar = !f.area || (f.area === '__other' ? !TOP_AREAS.includes(p.area) : p.area === f.area);
    return hit && ar && (!f.category || p.category === f.category) && (!f.types.length || f.types.includes(p.type)) && (!f.floors.length || f.floors.some(x => p.floors.includes(x)));
  });
}

/* ───────── 공통 조각 ───────── */
const btn = (label, a, cls = '') => `<button type="button" class="b ${cls}" data-a="${a}">${label}</button>`;
const chip = (label, on, a) => `<button type="button" class="c ${on ? 'on' : ''}" data-a="${a}">${on ? '✓ ' : ''}${label}</button>`;
const img = (t, cls = '') => `<div class="img ${cls}"><span>${t}</span></div>`;
const fmtTime = t => new Date(t).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
const dayDiff = t => { const a = new Date(t), b = new Date(); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 864e5); };
const dirty = () => JSON.stringify(S.pdraft) !== JSON.stringify(S.prefs);
const empty = (t, s, b = '') => `<div class="dash"><p>${t}</p><p>${s}</p>${b}</div>`;
const moreBtn = (key, total) => total > pageOf(S.shown[key]) ? btn(`더 보기 (${total - pageOf(S.shown[key])}곳 남음)`, 'more:' + key, 'sm') : '';

function pcard(p, { mode = 'list', time = '' } = {}) {
  const saved = S.saved.has(p.id);
  const top = mode === 'list' ? `<button type="button" class="s" data-a="save:${p.id}">${saved ? '저장됨' : '저장'}</button>` : '';
  const foot = mode === 'fav'
    ? `<div class="bt"><span>상세 보기 →</span><button type="button" class="b sm" data-a="save:${p.id}">저장 해제</button></div>`
    : mode === 'recent'
    ? `<div class="bt"><span>상세 보기 →</span><button type="button" class="b sm" data-a="place:${p.id}">상세 이동</button></div>` : '';
  return `<div class="card" data-a="place:${p.id}">${img('이미지')}<div class="bd">
    ${time ? `<div>${time}</div>` : ''}<div class="bt"><span>${p.name}</span>${top}</div>
    <div>내 위치에서 ${distText(p)}</div><div>${p.category} · ${p.type || '업태 정보 없음'}</div><div>${p.area || '지역 정보 없음'} · ${floorText(p)}</div>${foot}</div></div>`;
}

/* ───────── 렌더 ───────── */
const TAB = { '04': 'home', '05': 'search', '07': 'search', '08': 'mypage', '09': 'mypage', '10': 'mypage' };
function render(top) {
  const c = $('#content'), st = top ? 0 : c.scrollTop;
  $('#bar').innerHTML = BAR[S.screen]();
  c.className = S.screen === '04' ? 'full' : '';
  c.innerHTML = BODY[S.screen]();
  const t = TAB[S.screen], tabs = $('#tabs');
  tabs.hidden = !t;
  tabs.innerHTML = [['home', '홈'], ['search', '검색'], ['mypage', '마이페이지']]
    .map(([k, l]) => `<button type="button" class="${k === t ? 'on' : ''}" data-a="tab:${k}">${l}</button>`).join('');
  c.scrollTop = st;
  if (S.screen === '03') paintSignup();
  if (S.screen === '04') { initHome(); homeDraw(); }
}
function flash(t) {
  document.querySelectorAll('.msg').forEach(m => m.remove());
  const m = Object.assign(document.createElement('div'), { className: 'msg', textContent: t });
  $('#phone').append(m); setTimeout(() => m.remove(), 1600);
}
function nav(to) {
  if (S.screen === '08' && to !== '08' && dirty()) {
    if (!confirm('저장하지 않은 수정 내용이 있어요. 이동할까요?')) return;
    S.pdraft = structuredClone(S.prefs);
  }
  S.screen = to; S.err = ''; render(true);
}

/* ───────── 홈: 지도(드래그·휠·핀치 줌) + 바텀시트 ───────── */
const PEEK = 120, MAP = { x: null, y: null, k: null };
let sheetIdx = 0, HOME = {}, POOL = [], lastSig = '', vtm = 0;
const distText = p => { const [x, y] = pinPos(p), [cx, cy] = D.map.me, m = Math.round(Math.hypot(x - cx, y - cy) / 10) * 10;   // 지도 1px = 1m (임의 배치 좌표 기준)
  return m < 1000 ? `${m}m` : `${(m / 1000).toFixed(1)}km`; };
const pinPos = p => {                       // 좌표 데이터가 없어 id 기반으로 내 위치 주변에 임의 배치
  const [cx, cy] = D.map.me, r = Math.sqrt((Math.imul(p.id, 2654435761) >>> 0) / 4294967296) * 1100;
  const a = (Math.imul(p.id + 7, 2246822519) >>> 0) / 4294967296 * 2 * Math.PI;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
};
const viewRect = (m = 0) => { const r = $('.homemap').getBoundingClientRect(), k = MAP.k; return [(-MAP.x - m) / k, (-MAP.y - m) / k, (r.width - MAP.x + m) / k, (r.height - MAP.y + m) / k]; };
const inView = (pos, v) => pos[0] >= v[0] && pos[0] <= v[2] && pos[1] >= v[1] && pos[1] <= v[3];

function drawPins() {                       // 화면 안(+여유 200px)에 들어온 장소만 핀으로 로드, 벗어난 핀은 제거
  const box = $('#pins'); if (!box) return;
  const want = POOL.filter(o => inView(o.pos, viewRect(200))), ids = new Set(want.map(o => String(o.p.id)));
  const have = new Set([...box.children].map(c => c.dataset.id));
  [...box.children].forEach(c => { if (!ids.has(c.dataset.id)) c.remove(); });
  want.forEach(({ p, pos }) => { if (!have.has(String(p.id))) box.insertAdjacentHTML('beforeend',
    `<button type="button" class="pin" data-id="${p.id}" style="left:${pos[0]}px;top:${pos[1]}px" data-a="place:${p.id}" aria-label="${p.name}"><small>${p.name}</small><i></i></button>`); });
}
function scheduleView() {                   // 이동이 멈추면(0.2초) 시트 목록을 지도 영역 기준으로 다시 로드
  const st = $('#hstat'); if (st) st.textContent = '지도 영역 불러오는 중…';
  clearTimeout(vtm); vtm = setTimeout(() => drawView(), 200);
}
function drawView(force) {
  const lst = $('#hlist'); if (!lst) return;
  const v = viewRect(0), items = POOL.filter(o => inView(o.pos, v)).map(o => o.p).sort((a, b) => scoreOf(b) - scoreOf(a) || a.id - b.id);
  const sig = items.map(p => p.id).join(','), changed = sig !== lastSig; lastSig = sig;
  const stat = `보이는 영역 ${items.length}곳 불러옴 · 좌표 없음(핀·거리 임의 배치)`;
  if (!changed && !force) { $('#hstat').textContent = stat; return; }
  if (changed && !force) S.shown.home = 1;
  const st = lst.scrollTop;
  $('#hcount').textContent = `지도 영역 ${items.length}곳 · 전체 ${POOL.length}곳`;
  lst.innerHTML = items.length ? items.slice(0, pageOf(S.shown.home)).map(p => pcard(p)).join('') + moreBtn('home', items.length)
    : empty('이 지도 영역에 장소가 없어요', '지도를 움직이거나 확대·축소해 보세요.');
  lst.scrollTop = changed && !force ? 0 : st;
  $('#hstat').textContent = stat;
}
const drawPop = () => { $('#popchips').innerHTML = [['전체', ''], ...CATS.map(c => [c, c])].map(([l, v]) => chip(l, S.popCat === v, 'hfpick:' + v)).join(''); };
function homeDraw() {                       // 칩·취향·추천 풀이 바뀔 때 (지도 위치는 유지)
  const { cats, types } = S.prefs;
  POOL = recommend().map(p => ({ p, pos: pinPos(p) }));
  $('#hfbtn').textContent = `필터 · ${S.nearCat || '전체'}`;
  $('#hprefs').textContent = [...cats, ...types].join(' · ') || '저장한 취향이 없어요';
  $('#pins').innerHTML = ''; drawPins();
  lastSig = ''; drawView(true);
}
function initHome() {
  const cfg = D.map, M = MAP, box = $('.homemap'), world = $('#world'), sheet = $('.sheet'), home = $('.home'), drag = $('.drag');
  const R = () => box.getBoundingClientRect();
  const clamp = () => { const r = R(), W = cfg.size * M.k;                 // 지도 가장자리 밖으로 나가지 않게
    M.x = W <= r.width ? (r.width - W) / 2 : Math.min(0, Math.max(r.width - W, M.x));
    M.y = W <= r.height ? (r.height - W) / 2 : Math.min(0, Math.max(r.height - W, M.y)); };
  const apply = () => { clamp(); world.style.transform = `translate(${M.x}px,${M.y}px) scale(${M.k})`; world.style.setProperty('--k', M.k); drawPins(); scheduleView(); };
  const center = () => { const r = R(); M.k = cfg.zoom; M.x = r.width / 2 - cfg.me[0] * M.k; M.y = (r.height - PEEK) / 2 + 20 - cfg.me[1] * M.k; };
  const zoomAt = (cx, cy, nk) => { nk = Math.min(cfg.maxZoom, Math.max(cfg.minZoom, nk)); const f = nk / M.k; M.x = cx - (cx - M.x) * f; M.y = cy - (cy - M.y) * f; M.k = nk; apply(); };
  const anim = fn => { world.style.transition = 'transform .3s ease'; fn(); setTimeout(() => world.style.transition = '', 320); };
  const mid = () => [R().width / 2, (R().height - sheet.offsetHeight) / 2];
  if (M.x === null) center();
  apply();
  HOME = { zin: () => anim(() => zoomAt(...mid(), M.k * 1.4)), zout: () => anim(() => zoomAt(...mid(), M.k / 1.4)), zme: () => anim(() => { center(); apply(); }) };

  const pts = new Map(); let last = 0;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('.pin')) return;
    box.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    world.style.transition = ''; if (pts.size === 2) last = dist();
  });
  box.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const px = p[0], py = p[1]; p[0] = e.clientX; p[1] = e.clientY;
    if (pts.size === 2) { const [a, b] = [...pts.values()], r = R(), d = dist(); zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, M.k * d / last); last = d; }
    else { M.x += p[0] - px; M.y += p[1] - py; apply(); }
  });
  ['pointerup', 'pointercancel'].forEach(t => box.addEventListener(t, e => pts.delete(e.pointerId)));
  box.addEventListener('wheel', e => { e.preventDefault(); const r = R(); zoomAt(e.clientX - r.left, e.clientY - r.top, M.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });

  const snaps = () => [PEEK, Math.round(R().height * .5), R().height - 60];
  const setH = (h, a) => {
    sheet.style.transition = a ? 'height .25s ease' : 'none'; sheet.style.height = h + 'px';
    home.style.setProperty('--sh', h + 'px'); home.classList.toggle('max', h > snaps()[2] - 20);
  };
  setH(snaps()[sheetIdx]);
  let sy = 0, sh = 0, moved = false, id = null;
  drag.addEventListener('pointerdown', e => { drag.setPointerCapture(e.pointerId); id = e.pointerId; sy = e.clientY; sh = sheet.offsetHeight; moved = false; });
  drag.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const dy = e.clientY - sy; if (Math.abs(dy) > 4) moved = true;
    if (moved) setH(Math.min(snaps()[2], Math.max(PEEK, sh - dy)));
  });
  const end = e => {
    if (e.pointerId !== id) return; id = null;
    const s = snaps(), h = sheet.offsetHeight;
    sheetIdx = moved ? s.reduce((b, v, i) => Math.abs(v - h) < Math.abs(s[b] - h) ? i : b, 0) : (sheetIdx + 1) % 3;
    setH(s[sheetIdx], true);
  };
  drag.addEventListener('pointerup', end); drag.addEventListener('pointercancel', end);
}

/* ───────── 회원가입 검증 (입력 중에는 부분 갱신) ───────── */
function paintSignup() {
  const g = S.signup, m = !!g.pw && g.pw === g.pw2;
  const hint = (k, h) => { const n = $(`[data-hint=${k}]`); if (n) n.textContent = hintText(h); };
  const set = (k, v) => { const n = $(`[data-err=${k}]`); if (n) n.textContent = v ? '! ' + v : ''; };
  hint('nick', nickHint(g.nick)); hint('pw', pwHint(g.pw));
  set('pw2', g.pw2 && !m ? '비밀번호가 일치하지 않아요.' : '');
  set('fail', g.state === 'fail' ? '계정을 만들지 못했어요. 입력과 동의는 그대로 유지돼요. 다시 시도해 주세요.' : '');
  const b = $('#sbtn');
  b.textContent = { idle: '동의하고 계정 만들기', busy: '계정을 만드는 중…', fail: '다시 시도' }[g.state];
  b.disabled = g.state === 'busy' || (g.state !== 'fail' && !signupOk(g));
}

/* ───────── 액션 ───────── */
const ACT = {
  go: a => nav(a),
  back() { nav({ '02': '01', '03': '01', '06': '05', '07': S.from }[S.screen]); },
  tab(a) {
    if (a === 'home') return nav('04');
    if (a === 'search') return nav('05');
    nav(S.user ? '08' : '02');
  },
  seg: a => nav(a),
  place(a) {
    S.placeId = +a; S.from = S.screen;
    S.history = [{ id: +a, at: Date.now() }, ...S.history.filter(h => h.id !== +a)];
    nav('07');
  },
  save(a) {
    a = +a;
    const on = !S.saved.has(a);
    on ? S.saved.add(a) : S.saved.delete(a);
    flash(on ? '즐겨찾기에 저장했어요.' : '저장을 해제했어요.');
    S.screen === '04' ? homeDraw() : render();
  },
  more(a) { S.shown[a]++; a === 'home' ? homeDraw() : render(); },
  route() {
    const p = place(S.placeId);
    window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(p.address || p.name), '_blank', 'noopener');
    flash('길찾기를 새 탭에서 열었어요.');
  },
  hfopen() { S.popCat = S.nearCat; drawPop(); $('#pop').hidden = false; },
  hfpick(a) { S.popCat = a; drawPop(); },
  hfclose() { $('#pop').hidden = true; },
  hfapply() { S.nearCat = S.popCat; S.shown.home = 1; $('#pop').hidden = true; homeDraw(); },
  zin: () => HOME.zin(), zout: () => HOME.zout(), zme: () => HOME.zme(),
  loc() {
    const a = prompt('현재 위치 지역(행정동)을 입력하세요', S.area);
    if (a && a.trim()) { S.area = a.trim(); S.shown.home = 1; render(); }
  },
  mode(a) { S.search.mode = a; S.shown.search = 1; render(); },
  clearq() { S.search.query = ''; S.err = ''; render(); },
  filter() { S.draft = { ...structuredClone(S.applied), mode: S.search.mode }; nav('06'); },
  fmode(a) { S.draft.mode = a; render(); },
  farea(a) { S.draft.area = a; render(); },
  fcat(a) { S.draft.category = S.draft.category === a ? '' : a; S.draft.types = S.draft.types.filter(t => (TYPES[S.draft.category] || []).includes(t)); render(); },
  ftype(a) { S.draft.types = toggle(S.draft.types, a); render(); },
  ffloor(a) { S.draft.floors = toggle(S.draft.floors, a); render(); },
  freset() { S.draft = { ...noFilter(), mode: S.draft.mode }; render(); },
  fapply() {
    const { mode, ...f } = S.draft;
    S.applied = f; S.search.mode = mode; S.draft = null; S.shown.search = 1; nav('05');
    flash(searchStores().length ? '조건을 적용했어요.' : '결과가 없어요. 조건을 줄여 보세요.');
  },
  pw() { S.login.show = !S.login.show; render(); },
  chk(a) {
    S.signup[a] = !S.signup[a]; if (S.signup.state !== 'busy') S.signup.state = 'idle';
    const b = $(`[data-a="chk:${a}"] .ck`); if (b) b.textContent = S.signup[a] ? '✓' : '';
    paintSignup();
  },
  view() { flash('약관 내용은 목업에서 제공하지 않아요.'); },
  pcat(a) {
    const d = S.pdraft; d.cats = toggle(d.cats, a);
    d.types = d.types.filter(t => d.cats.some(c => (TYPES[c] || []).includes(t)));     // 해제한 카테고리의 업종은 함께 해제
    render();
  },
  ptype(a) { S.pdraft.types = toggle(S.pdraft.types, a); render(); },
  psave() { S.prefs = structuredClone(S.pdraft); S.nearCat = ''; S.shown.home = 1; flash('취향을 저장했어요.'); render(); },
  favcat(a) { S.favCat = a; render(); },
  logout() { S.user = false; flash('로그아웃했어요.'); nav('01'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const i = el.dataset.a.indexOf(':'), a = i < 0 ? el.dataset.a : el.dataset.a.slice(0, i), arg = i < 0 ? '' : el.dataset.a.slice(i + 1);
  ACT[a]?.(arg);
});

/* ───────── 입력 · 폼 제출 ───────── */
document.addEventListener('input', e => {
  const p = e.target.dataset.in; if (!p) return;
  const k = p.split('.'); k.reduce((o, key, j) => j === k.length - 1 ? (o[key] = e.target.value) : o[key], S);
  if (k[0] === 'signup') { if (S.signup.state !== 'busy') S.signup.state = 'idle'; paintSignup(); }
});
const FORM = {
  login() {
    const L = S.login; if (L.busy) return;
    L.err = {};
    if (!S.loginNick.trim()) L.err.nick = '닉네임을 입력해 주세요.';
    if (!L.pw) L.err.pw = '비밀번호를 입력해 주세요.';
    if (L.err.nick || L.err.pw) return render();
    L.busy = true; render();
    setTimeout(() => { L.busy = false; L.pw = ''; S.user = true; nav('04'); flash('로그인했어요. 저장한 취향을 불러왔어요.'); }, 700);
  },
  signup() {
    const g = S.signup;
    if (g.state === 'busy' || !signupOk(g)) return;
    g.state = 'busy'; paintSignup();
    setTimeout(() => {
      if (g.nick.toLowerCase().startsWith('fail')) { g.state = 'fail'; paintSignup(); return; }      // 실패 시연: 닉네임이 fail 로 시작
      g.state = 'idle'; S.loginNick = g.nick; nav('02'); flash('계정을 만들었어요. 로그인해 주세요.');
    }, 800);
  },
  search() {
    if (!S.search.query.trim()) { S.err = '검색어를 입력해 주세요.'; return render(); }
    S.err = ''; S.shown.search = 1; render();
  }
};
document.addEventListener('submit', e => { e.preventDefault(); FORM[e.target.dataset.form]?.(); });

init(); render(true);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlaceON 로우파이 와이어프레임 (모바일)</title>
<style>
/* 로우파이: 흑백 · 단일 서체/크기/굵기 · 아이콘 없음 · 둥근 모서리/그림자 없음 */
*{box-sizing:border-box;margin:0;padding:0;font:inherit;color:#000;border-radius:0}
html{font:16px/1.5 sans-serif;-webkit-text-size-adjust:100%}
html,body{height:100%;overscroll-behavior:none}
body{background:#fff;display:flex;justify-content:center}
button,input{background:#fff;border:1px solid #000;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{cursor:text;padding:12px;width:100%;outline:none}
input:focus{outline:2px solid #000;outline-offset:1px}
hr{border:0;border-top:1px solid #000}

.phone{width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}
@media(min-width:431px){.phone{border-inline:2px solid #000}}
#bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid #000;min-height:56px}
#bar button{min-height:44px;padding:4px 14px}
#bar .t{flex:1}
#content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
#content.full{padding:0;overflow:hidden;position:relative}
#content>*+*,.stk>*+*{margin-top:12px}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #000;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{border:0;border-left:1px solid #000;min-height:56px}
#tabs button:first-child{border-left:0}
#tabs button.on,.c.on,.sg button.on{background:#000;color:#fff}

.b{display:block;width:100%;min-height:44px;padding:11px;text-align:center}
.b.p{border:3px double #000}
.b.sm,.s{width:auto;display:inline-block;min-height:44px;padding:8px 14px}
button:disabled{border-style:dashed;cursor:not-allowed}
.c{min-height:44px;padding:8px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box{border:1px solid #000;padding:12px}
.dash{border:1px dashed #000;padding:12px}
.card{display:flex;gap:12px;border:1px solid #000;padding:12px;cursor:pointer;position:relative;background:#fff}
.card .img{width:80px;height:80px;flex:none}
.card .bd{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.img{border:1px solid #000;display:grid;place-items:center;
  background:linear-gradient(to top right,transparent calc(50% - .5px),#000 calc(50% - .5px),#000 calc(50% + .5px),transparent calc(50% + .5px)),
             linear-gradient(to top left,transparent calc(50% - .5px),#000 calc(50% - .5px),#000 calc(50% + .5px),transparent calc(50% + .5px))}
.img span{background:#fff;padding:0 6px;text-align:center}
.img.h{height:150px}.img.m{height:130px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #000}
.sg button{border:0;border-left:1px solid #000;min-height:44px}
.sg button:first-child{border-left:0}
.user{display:flex;gap:12px;align-items:center}
.user .img{width:44px;height:44px;flex:none}
.user .g{flex:1}
.pw{display:flex;gap:8px}
.pw .field{flex:1}
.msg{position:absolute;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));border:2px solid #000;background:#fff;padding:8px 12px;z-index:9}

/* 홈: 전체 화면 지도 + 바텀시트 */
.home{position:absolute;inset:0;overflow:hidden;--sh:170px}
.homemap{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;background:#fff;cursor:grab}
#world{position:absolute;left:0;top:0;width:1000px;height:1000px;transform-origin:0 0}
#world svg{display:block;pointer-events:none}
.pin{position:absolute;z-index:3;transform:translate(-50%,-100%) scale(calc(1 / var(--k,1)));transform-origin:50% 100%;border:0;background:none;padding:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pin i{display:block;width:14px;height:14px;background:#000}
.pin small,.me small{font-size:12px;border:1px solid #000;background:#fff;padding:0 6px;white-space:nowrap}
.me{position:absolute;left:500px;top:500px;z-index:2;width:18px;height:18px;border-radius:50%;background:#000;border:3px solid #fff;box-shadow:0 0 0 2px #000;transform:translate(-50%,-50%) scale(calc(1 / var(--k,1)))}
.me small{position:absolute;top:28px;left:50%;transform:translateX(-50%)}
.maptop{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.maptop>*{pointer-events:auto;align-self:flex-start}
.pill{border:1px solid #000;background:#fff;padding:4px 12px}
.ctrl{position:absolute;right:10px;bottom:calc(var(--sh) + 12px);z-index:5;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:56px;min-height:44px;padding:0}
.home.max .ctrl{display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;height:170px;background:#fff;border-top:2px solid #000;display:flex;flex-direction:column}
.drag{touch-action:none;cursor:grab;flex:none}
.grab{padding:10px 0;display:grid;place-items:center}
.grab i{display:block;width:40px;height:4px;background:#000}
.sheet-head{padding:0 16px 10px}
.sheet-list{flex:1;overflow-y:auto;padding:4px 16px 16px}
.sheet-list>*+*{margin-top:12px}
</style>
</head>
<body>

<div class="phone" id="phone">
  <header id="bar"></header>
  <main id="content"></main>
  <nav id="tabs" hidden></nav>
</div>

<!-- ① 화면 설정 · 기본값 (장소 데이터는 아래 stores 에서 불러옴) -->
<script type="application/json" id="data">
{
  "map": {"me": [500, 500], "zoom": 0.75, "minZoom": 0.4, "maxZoom": 2.5},
  "homeLimit": 30,
  "pageSize": 20,
  "conditions": ["지상", "2층 이상", "지하"],
  "locations": {
    "지상": ["지상"],
    "지상2층이상": ["2층 이상"],
    "지하": ["지하"],
    "지상+지하": ["지상", "지하"],
    "지하 및 지상": ["지상", "지하"]
  },
  "intro": [
    ["가까운 장소 추천", "현재 지역의 주변 장소를 살펴보세요."],
    ["내 취향에 맞게 검색", "키워드 또는 지역과 조건으로 찾아보세요."],
    ["마음에 드는 장소 저장", "즐겨찾기와 최근 본 장소를 모아보세요."]
  ],
  "defaults": {
    "area": "명동",
    "search": {"query": "카페", "mode": "keyword"},
    "filters": {"category": "", "type": "", "conditions": []},
    "prefs": {"cats": ["카페/디저트", "음식점"], "conds": ["지상"], "extra": ""},
    "saved": ["s147", "s163"],
    "history": [{"id": "s147", "hoursAgo": 0}, {"id": "s163", "hoursAgo": 2}, {"id": "s1", "hoursAgo": 24}]
  }
}
</script>

<!-- ② 장소 데이터: [] 를 stores.json 내용 전체로 바꿔 붙여넣거나, 비워 두고 같은 폴더의 stores.json 을 사용 -->
<script type="application/json" id="stores">[]</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PM = new Map();
const place = id => PM.get(id);
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const isPw = v => v.length >= 8 && /[A-Za-z]/.test(v) && /\d/.test(v);
const toggle = (a, v) => a.includes(v) ? a.filter(x => x !== v) : [...a, v];
const fcount = f => f.conditions.length + (f.category ? 1 : 0) + (f.type ? 1 : 0);
const lc = s => String(s || '').toLowerCase();
let S;

/* ───────── stores.json → 화면용 데이터 변환 ───────── */
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function build(raw) {
  D.places = raw.map(r => {
    const road = (r['소재지 도로'] || '').trim();
    const conds = D.locations[(r['업소위치'] || '').trim()] || [];
    return {
      id: 's' + r.id,
      name: (r['업소명'] || '').trim() || '이름 없음',
      category: r['카테고리'] || '분류 없음',
      type: r['업태명'] || '',
      area: r['행정동명'] || '',
      road,
      short: road.replace(/\s*\([^)]*\)\s*$/, ''),          // 끝의 (법정동) 제거한 짧은 주소
      jibun: (r['소재지 지번'] || '').replace(/\s+/g, ' ').trim(),
      conds,
      locLabel: conds.join('+'),
      pos: [Math.round(60 + rnd(r.id) * 880), Math.round(60 + rnd(r.id + 1000) * 880)]   // 좌표 없음 → 고정 임의 배치
    };
  });
  D.places.forEach(p => PM.set(p.id, p));
  const count = {}; D.types = {};
  D.places.forEach(p => {
    count[p.category] = (count[p.category] || 0) + 1;
    if (p.type) (D.types[p.category] ||= new Set()).add(p.type);
  });
  D.categories = Object.keys(count).filter(c => c !== '분류 없음').sort((a, b) => count[b] - count[a]);
  Object.keys(D.types).forEach(k => D.types[k] = [...D.types[k]].sort());
}
function loadStores() {
  const t = $('#stores').textContent.trim();
  if (t && t !== '[]') return Promise.resolve(JSON.parse(t));
  return fetch('stores.json').then(r => { if (!r.ok) throw 0; return r.json(); });
}

function init() {
  const d = D.defaults;
  S = {
    screen: '01', user: false, err: '', loginEmail: '',
    area: d.area, search: { ...d.search }, applied: structuredClone(d.filters), draft: null, nearCat: '', shown: D.pageSize,
    prefs: structuredClone(d.prefs), pdraft: structuredClone(d.prefs), favCat: '',
    saved: new Set(d.saved.filter(id => PM.has(id))),
    history: d.history.filter(h => PM.has(h.id)).map(h => ({ id: h.id, at: Date.now() - h.hoursAgo * 3600e3 })),
    placeId: null, from: '04',
    login: { pw: '', show: false, busy: false, err: {} },
    signup: { email: '', pw: '', pw2: '', terms: false, priv: false, state: 'idle' }
  };
}

/* ───────── 추천·검색 로직 ───────── */
function recommend() {
  const { cats, conds } = S.prefs, any = cats.length || conds.length;
  const score = p => (cats.includes(p.category) ? 2 : 0) + (p.conds.some(c => conds.includes(c)) ? 1 : 0);
  const total = p => score(p) + (p.area && p.area === S.area ? 1 : 0);        // 현재 지역 가산점
  return D.places.filter(p => (!any || score(p) > 0) && (!S.nearCat || p.category === S.nearCat))
    .sort((a, b) => total(b) - total(a));
}
function searchPlaces() {
  const q = lc(S.search.query.trim()), { mode } = S.search, f = S.applied;
  if (!q) return [];
  return D.places.filter(p => {
    const hit = mode === 'keyword'
      ? [p.name, p.category, p.type, p.area].some(x => lc(x).includes(q))
      : [p.area, p.name, p.road].some(x => lc(x).includes(q));
    const cat = !f.category || p.category === f.category;
    const typ = !f.type || p.type === f.type;
    const con = !f.conditions.length || f.conditions.some(c => p.conds.includes(c));
    return hit && cat && typ && con;
  });
}

/* ───────── 공통 조각 ───────── */
const btn = (label, a, cls = '') => `<button type="button" class="b ${cls}" data-a="${esc(a)}">${label}</button>`;
const chip = (label, on, a) => `<button type="button" class="c ${on ? 'on' : ''}" data-a="${esc(a)}">${on ? '✓ ' : ''}${esc(label)}</button>`;
const img = (t, cls = '') => `<div class="img ${cls}"><span>${t}</span></div>`;
const fmtTime = t => new Date(t).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
const dayDiff = t => { const a = new Date(t), b = new Date(); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 864e5); };
const dirty = () => JSON.stringify(S.pdraft) !== JSON.stringify(S.prefs);
const empty = (t, s, b = '') => `<div class="dash"><p>${t}</p><p>${s}</p>${b}</div>`;
const catLine = p => p.category + (p.type ? ' · ' + p.type : '');
const subOf = p => (p.area || '지역 정보 없음') + (p.locLabel ? ' · ' + p.locLabel : '');

function pcard(p, { sub, mode = 'list', time = '' }) {
  const saved = S.saved.has(p.id);
  const top = mode === 'list' ? `<button type="button" class="s" data-a="save:${p.id}">${saved ? '저장됨' : '저장'}</button>` : '';
  const foot = mode === 'fav'
    ? `<div class="bt"><span>상세 보기 →</span><button type="button" class="b sm" data-a="save:${p.id}">저장 해제</button></div>`
    : mode === 'recent'
    ? `<div class="bt"><span>상세 보기 →</span><button type="button" class="b sm" data-a="place:${p.id}">상세 이동</button></div>` : '';
  return `<div class="card" data-a="place:${p.id}">${img('이미지')}<div class="bd">
    ${time ? `<div>${time}</div>` : ''}<div class="bt"><span>${esc(p.name)}</span>${top}</div>
    <div>${esc(catLine(p))}</div><div>${esc(sub)}</div><div>${esc(p.short || '주소 정보 없음')}</div>${foot}</div></div>`;
}

const userBlock = seg => `
  <div class="bt"><div class="user">${img('')}<div class="g"><p>사용자님</p><p>${esc(S.loginEmail || 'user@example.com')}</p></div></div>
    <button type="button" class="b sm" data-a="logout">로그아웃</button></div>
  <div class="sg">${[['08', '취향 설정'], ['09', '즐겨찾기'], ['10', '최근 본 장소']].map(([k, l]) =>
    `<button type="button" class="${seg === k ? 'on' : ''}" data-a="seg:${k}">${l}</button>`).join('')}</div>`;

/* ───────── 앱바 ───────── */
const back = `<button type="button" data-a="back">뒤로</button>`;
const BAR = {
  '01': () => `<span>PlaceON</span><span class="t"></span><button type="button" data-a="go:04">닫기</button>`,
  '02': () => `${back}<span class="t">로그인</span>`,
  '03': () => `${back}<span class="t">회원가입</span>`,
  '04': () => `<span>PlaceON</span><span class="t"></span><button type="button" data-a="go:01">서비스 소개</button><button type="button" data-a="loc">위치 변경</button>`,
  '05': () => `<span>장소 검색</span>`,
  '06': () => `${back}<span class="t">검색 조건 설정</span><button type="button" data-a="freset">초기화</button>`,
  '07': () => `${back}<span class="t">장소 상세</span>`,
  '08': () => `<span>마이페이지</span>`, '09': () => `<span>마이페이지</span>`, '10': () => `<span>마이페이지</span>`
};

/* ───────── 화면 본문 ───────── */
const MAPSVG = `<svg width="1000" height="1000" viewBox="0 0 1000 1000" aria-hidden="true">
  <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000"/></pattern></defs>
  <rect width="1000" height="1000" fill="#fff"/>
  <path d="M0 880C250 820 400 940 650 860S900 800 1000 840V1000H0Z" fill="url(#hatch)" stroke="#000"/>
  <rect x="640" y="620" width="260" height="190" fill="none" stroke="#000" stroke-dasharray="8 6"/>
  <path d="M0 0V1000M114 0V1000M205 0V1000M319 0V1000M410 0V1000M501 0V1000M615 0V1000M706 0V1000M820 0V1000M911 0V1000M0 0H1000M0 114H1000M0 205H1000M0 319H1000M0 410H1000M0 501H1000M0 615H1000M0 706H1000M0 820H1000M0 911H1000" stroke="#000" stroke-dasharray="2 8" fill="none"/>
  <path d="M0 250L1000 650M200 0L760 1000" stroke="#000" stroke-width="2" fill="none"/>
  <text x="660" y="650">공원 영역</text><text x="40" y="960">강</text></svg>`;

const BODY = {
  '01': () => `
    <p>내 주변에서 찾는<br>나에게 맞는 장소</p>
    <p>취향과 위치를 바탕으로 카페, 음식점, 미용실 등 가고 싶은 장소를 찾아보세요.</p>
    ${img('주변 장소 추천 화면', 'h')}
    ${D.intro.map(([t, s]) => `<div class="box"><p>${t}</p><p>${s}</p></div>`).join('')}
    <hr>
    ${btn('로그인', 'go:02', 'p')}
    ${btn('이메일로 회원가입', 'go:03')}
    <p>계정에 취향, 저장 장소와 조회 기록이 연결됩니다.</p>`,

  '02': () => { const L = S.login; return `
    <form class="stk" data-form="login" novalidate>
      <p>다시 만나 반가워요</p><p>로그인하고 저장한 취향과 장소를 이어서 확인하세요.</p>
      <p>이메일</p><div><input data-in="loginEmail" placeholder="이메일 주소 입력" value="${esc(S.loginEmail)}"></div>
      <p>${L.err.email ? '! ' + L.err.email : ''}</p>
      <p>비밀번호</p>
      <div class="pw"><div class="field"><input data-in="login.pw" type="${L.show ? 'text' : 'password'}" placeholder="비밀번호 입력" value="${esc(L.pw)}"></div>
        <button type="button" data-a="pw">${L.show ? '숨김' : '표시'}</button></div>
      <p>${L.err.pw ? '! ' + L.err.pw : ''}</p>
      <button type="submit" class="b p" ${L.busy ? 'disabled' : ''}>${L.busy ? '로그인 중…' : '로그인'}</button>
      <div class="box">인증이 완료되면 계정에 연결된 취향, 즐겨찾기와 최근 조회 기록을 불러옵니다.</div>
      <hr><p>아직 계정이 없으신가요?</p>
      ${btn('회원가입으로 이동', 'go:03')}
    </form>`; },

  '03': () => { const g = S.signup; return `
    <form class="stk" data-form="signup" novalidate>
      <p>나만의 장소 찾기 시작</p><p>이메일과 비밀번호로 계정을 만드세요.</p>
      <p>이메일</p><div><input data-in="signup.email" placeholder="name@example.com" value="${esc(g.email)}"></div><p data-err="email"></p>
      <p>비밀번호</p><div><input data-in="signup.pw" type="password" placeholder="비밀번호 입력" value="${esc(g.pw)}"></div>
      <p>8자 이상, 영문과 숫자를 함께 입력해 주세요.</p><p data-err="pw"></p>
      <p>비밀번호 확인</p><div><input data-in="signup.pw2" type="password" placeholder="비밀번호 다시 입력" value="${esc(g.pw2)}"></div><p data-err="pw2"></p>
      <div class="bt"><button type="button" class="b" style="border:0;text-align:left" data-a="chk:terms">${g.terms ? '[x]' : '[ ]'} [필수] 서비스 이용약관 동의</button><button type="button" class="b sm" data-a="view">보기</button></div>
      <div class="bt"><button type="button" class="b" style="border:0;text-align:left" data-a="chk:priv">${g.priv ? '[x]' : '[ ]'} [필수] 개인정보 수집·이용 동의</button><button type="button" class="b sm" data-a="view">보기</button></div>
      <p data-err="fail"></p>
      <button type="submit" class="b p" id="sbtn">동의하고 계정 만들기</button>

/* ───────── 홈: 지도(드래그·휠·핀치 줌) + 바텀시트 ───────── */
const PEEK = 170, MAP = { x: null, y: null, k: null };
let sheetIdx = 0, HOME = {};
function homeDraw() {
  const all = recommend(), list = all.slice(0, D.homeLimit), { cats, conds } = S.prefs, lst = $('#hlist'), st = lst.scrollTop;
  $('#hcats').innerHTML = [['전체', ''], ...cats.map(c => [c, c])].map(([l, v]) => chip(l, S.nearCat === v, 'near:' + v)).join('');
  $('#hcount').textContent = `총 ${all.length}곳 · 상위 ${list.length}곳 표시`;
  $('#hprefs').textContent = [...cats, ...conds].join(' · ') || '저장한 취향이 없어요';
  $('#pins').innerHTML = list.map(p => `<button type="button" class="pin" style="left:${p.pos[0]}px;top:${p.pos[1]}px" data-a="place:${p.id}" aria-label="${esc(p.name)}"><small>${esc(p.name)}</small><i></i></button>`).join('');
  lst.innerHTML = list.length ? list.map(p => pcard(p, { sub: subOf(p) })).join('') : empty('조건에 맞는 장소가 없어요', '취향 설정을 바꿔 보세요.');
  lst.scrollTop = st;
}
function initHome() {
  const cfg = D.map, M = MAP, box = $('.homemap'), world = $('#world'), sheet = $('.sheet'), home = $('.home'), drag = $('.drag');
  const R = () => box.getBoundingClientRect();
  const apply = () => { world.style.transform = `translate(${M.x}px,${M.y}px) scale(${M.k})`; world.style.setProperty('--k', M.k); };
  const center = () => { const r = R(); M.k = cfg.zoom; M.x = r.width / 2 - cfg.me[0] * M.k; M.y = (r.height - PEEK) / 2 + 20 - cfg.me[1] * M.k; };
  const zoomAt = (cx, cy, nk) => { nk = Math.min(cfg.maxZoom, Math.max(cfg.minZoom, nk)); const f = nk / M.k; M.x = cx - (cx - M.x) * f; M.y = cy - (cy - M.y) * f; M.k = nk; apply(); };
  const anim = fn => { world.style.transition = 'transform .3s ease'; fn(); setTimeout(() => world.style.transition = '', 320); };
  const mid = () => [R().width / 2, (R().height - sheet.offsetHeight) / 2];
  if (M.x === null) center();
  apply();
  HOME = { zin: () => anim(() => zoomAt(...mid(), M.k * 1.4)), zout: () => anim(() => zoomAt(...mid(), M.k / 1.4)), zme: () => anim(() => { center(); apply(); }) };

  const pts = new Map(); let last = 0;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('.pin')) return;
    box.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    world.style.transition = ''; if (pts.size === 2) last = dist();
  });
  box.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const px = p[0], py = p[1]; p[0] = e.clientX; p[1] = e.clientY;
    if (pts.size === 2) { const [a, b] = [...pts.values()], r = R(), d = dist(); zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, M.k * d / last); last = d; }
    else { M.x += p[0] - px; M.y += p[1] - py; apply(); }
  });
  ['pointerup', 'pointercancel'].forEach(t => box.addEventListener(t, e => pts.delete(e.pointerId)));
  box.addEventListener('wheel', e => { e.preventDefault(); const r = R(); zoomAt(e.clientX - r.left, e.clientY - r.top, M.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });

  const snaps = () => [PEEK, Math.round(R().height * .5), R().height - 60];
  const setH = (h, a) => {
    sheet.style.transition = a ? 'height .25s ease' : 'none'; sheet.style.height = h + 'px';
    home.style.setProperty('--sh', h + 'px'); home.classList.toggle('max', h > snaps()[2] - 20);
  };
  setH(snaps()[sheetIdx]);
  let sy = 0, sh = 0, moved = false, id = null;
  drag.addEventListener('pointerdown', e => { drag.setPointerCapture(e.pointerId); id = e.pointerId; sy = e.clientY; sh = sheet.offsetHeight; moved = false; });
  drag.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const dy = e.clientY - sy; if (Math.abs(dy) > 4) moved = true;
    if (moved) setH(Math.min(snaps()[2], Math.max(PEEK, sh - dy)));
  });
  const end = e => {
    if (e.pointerId !== id) return; id = null;
    const s = snaps(), h = sheet.offsetHeight;
    sheetIdx = moved ? s.reduce((b, v, i) => Math.abs(v - h) < Math.abs(s[b] - h) ? i : b, 0) : (sheetIdx + 1) % 3;
    setH(s[sheetIdx], true);
  };
  drag.addEventListener('pointerup', end); drag.addEventListener('pointercancel', end);
}

/* ───────── 회원가입 검증 (입력 중에는 부분 갱신) ───────── */
function paintSignup() {
  const g = S.signup, e = isEmail(g.email), p = isPw(g.pw), m = !!g.pw && g.pw === g.pw2, t = g.terms && g.priv, ok = e && p && m && t;
  const set = (k, v) => { const n = $(`[data-err=${k}]`); if (n) n.textContent = v ? '! ' + v : ''; };

  set('pw', g.pw && !p ? '8자 이상, 영문과 숫자를 함께 입력해 주세요.' : '');
  set('pw2', g.pw2 && !m ? '비밀번호가 일치하지 않아요.' : '');

    const L = S.login; if (L.busy) return;
    L.err = {};
    if (!S.loginEmail) L.err.email = '이메일을 입력해 주세요.'; else if (!isEmail(S.loginEmail)) L.err.email = '이메일 형식을 확인해 주세요.';
    if (!L.pw) L.err.pw = '비밀번호를 입력해 주세요.';
    if (L.err.email || L.err.pw) return render();
    L.busy = true; render();
    setTimeout(() => { L.busy = false; L.pw = ''; S.user = true; nav('04'); flash('로그인했어요. 저장한 취향을 불러왔어요.'); }, 700);
  },
  signup() {
    const g = S.signup;
    if (g.state === 'busy' || !(isEmail(g.email) && isPw(g.pw) && g.pw === g.pw2 && g.terms && g.priv)) return;
    g.state = 'busy'; paintSignup();
    setTimeout(() => {
      if (g.email.startsWith('fail')) { g.state = 'fail'; paintSignup(); return; }      // 실패 시연: 이메일이 fail 로 시작
      g.state = 'idle'; S.loginEmail = g.email; nav('02'); flash('계정을 만들었어요. 로그인해 주세요.');
    }, 800);
  },
  search() {
    if (!S.search.query.trim()) { S.err = '검색어를 입력해 주세요.'; return render(); }
    S.err = ''; S.shown = D.pageSize; render();
  }
};
document.addEventListener('submit', e => { e.preventDefault(); FORM[e.target.dataset.form]?.(); });

/* ───────── 시작 ───────── */
loadStores().then(raw => { build(raw); init(); render(true); })
  .catch(() => {
    $('#content').innerHTML = '<div class="dash"><p>장소 데이터를 불러오지 못했어요.</p><p>① stores.json 을 이 파일과 같은 폴더에 두고 로컬 서버로 열거나,<br>② &lt;script id="stores"&gt; 안의 [] 를 stores.json 내용으로 바꿔 주세요.</p></div>';
  });
</script>
